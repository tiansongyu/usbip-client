[features]
default = []
physical-nusb = ["dep:nusb", "dep:rustix", "dep:rustusb-linux"]

[dependencies]
rustusb-core.workspace = true
rustusb-protocol.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
