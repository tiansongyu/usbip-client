rustix = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
nusb = { workspace = true, optional = true }
rustusb-linux = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
