[package]
name = "rustusb-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rustusb"
path = "src/main.rs"

[features]
default = []
rust-backend = ["dep:rustusb-rust-backend"]

[dependencies]
rustusb-core.workspace = true
rustusb-linux.workspace = true
rustusb-protocol.workspace = true
rustusb-daemon.workspace = true
rustusb-native.workspace = true
rustusb-rust-backend = { workspace = true, optional = true }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
