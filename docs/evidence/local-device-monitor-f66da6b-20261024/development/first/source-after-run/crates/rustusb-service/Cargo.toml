[package]
name = "rustusb-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
rust-backend = ["dep:rustusb-rust-backend"]
physical-nusb = ["rust-backend", "rustusb-rust-backend/physical-nusb", "rustusb-daemon/physical-usb"]

[dependencies]
rustusb-core.workspace = true
rustusb-linux.workspace = true
rustusb-logging.workspace = true
rustusb-protocol.workspace = true
rustusb-daemon.workspace = true
rustusb-native.workspace = true
rustusb-transport.workspace = true
rustusb-rust-backend = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
rustix = { workspace = true, features = ["event"] }

[dev-dependencies]
tempfile.workspace = true
rcgen.workspace = true

[lints]
workspace = true
