<svg xmlns="http://www.w3.org/2000/svg" width="360" height="550" viewBox="0 0 360 550" role="img" aria-labelledby="title desc"><title id="title">Native USB/IP connection</title><desc id="desc">A USB device on a Linux server connects through an administrator-managed secure network to a native driver on the Linux client. Architecture illustration.</desc><rect width="360" height="550" rx="16" fill="#0c141c"/><g font-family="Segoe UI,Arial,sans-serif"><text x="24" y="34" fill="#9bafbe" font-size="13">Native path illustration</text><rect x="24" y="56" width="312" height="176" rx="10" fill="#101d29" stroke="#365369"/><text x="44" y="89" fill="#edf4f9" font-size="21" font-weight="600">Linux server</text><text x="44" y="116" fill="#9bafbe" font-size="13">RustUSB CLI + restricted helper</text><rect x="44" y="135" width="272" height="38" rx="5" fill="#182c3a"/><text x="180" y="160" fill="#bcebf6" font-family="Consolas,monospace" font-size="15" text-anchor="middle">usbip_host + usbipd</text><text x="180" y="207" fill="#eec18d" font-size="14" text-anchor="middle">Attached USB device</text><path d="M180 232v22m0 58v22" stroke="#83ddf2" stroke-width="2" stroke-dasharray="4 5"/><rect x="86" y="254" width="188" height="58" rx="28" fill="#132c37" stroke="#568b9e"/><text x="180" y="279" text-anchor="middle" fill="#edf4f9" font-size="17">USB/IP</text><text x="180" y="298" text-anchor="middle" fill="#9bafbe" font-size="12">Managed secure network</text><rect x="24" y="334" width="312" height="176" rx="10" fill="#101d29" stroke="#365369"/><text x="44" y="367" fill="#edf4f9" font-size="21" font-weight="600">Linux client</text><text x="44" y="394" fill="#9bafbe" font-size="13">RustUSB CLI + restricted helper</text><rect x="44" y="413" width="272" height="38" rx="5" fill="#182c3a"/><text x="180" y="438" fill="#bcebf6" font-family="Consolas,monospace" font-size="15" text-anchor="middle">vhci_hcd</text><text x="180" y="485" fill="#edf4f9" font-size="14" text-anchor="middle">Native device driver</text><text x="180" y="535" text-anchor="middle" fill="#9bafbe" font-size="12">Network security is configured externally</text></g></svg>
