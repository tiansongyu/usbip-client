[package]
name = "rustusb-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
physical-usb = ["rustix/net", "dep:nusb"]

[dependencies]
rustusb-core.workspace = true
rustusb-linux.workspace = true
rustusb-native.workspace = true
rustusb-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustix = { workspace = true, features = ["net"] }

[target.'cfg(target_os = "linux")'.dependencies]
nusb = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[[bin]]
name = "rustusb-helper"
path = "src/main.rs"
