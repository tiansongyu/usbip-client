<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title description">
  <title id="title">RustUSB Native USB/IP data path</title>
  <desc id="description">A USB device connects to a Linux server running usbip_host and usbipd. USB/IP traverses an administrator-managed secure network to vhci_hcd and the device's native driver on the Linux client. RustUSB manages both sides through restricted helpers. This is an architecture illustration, not a product screenshot.</desc>
  <defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#293a48"/></pattern></defs>
  <rect width="1120" height="460" rx="16" fill="#0c141c"/><rect width="1120" height="460" rx="16" fill="url(#grid)"/>
  <g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="42" fill="#9bafbe" font-size="13">Native USB/IP path</text><text x="1080" y="42" text-anchor="end" fill="#9bafbe" font-size="13">Architecture illustration</text>
    <path d="M354 225H766" fill="none" stroke="#315667" stroke-width="2"/>
    <path d="M370 225H491m137 0h122" fill="none" stroke="#83ddf2" stroke-width="2" stroke-dasharray="5 7"/>
    <rect x="44" y="90" width="310" height="260" rx="12" fill="#101d29" stroke="#365369"/>
    <path d="M70 125h25v16H70zm8 16v5m-5 0h15" fill="none" stroke="#83ddf2" stroke-width="1.8"/>
    <text x="108" y="139" fill="#edf4f9" font-size="21" font-weight="600">Linux server</text>
    <text x="70" y="176" fill="#9bafbe" font-size="14">RustUSB CLI + restricted helper</text>
    <rect x="70" y="200" width="258" height="48" rx="6" fill="#182c3a"/>
    <text x="199" y="230" fill="#bcebf6" font-family="Consolas,Liberation Mono,monospace" font-size="16" text-anchor="middle">usbip_host + usbipd</text>
    <path d="M199 248v22" stroke="#45647a" stroke-width="2"/>
    <rect x="114" y="272" width="170" height="47" rx="6" fill="#0c141c" stroke="#365369"/>
    <path d="M131 287h10v15h-10zm3-4v4m4-4v4" fill="none" stroke="#eec18d" stroke-width="1.7"/>
    <text x="157" y="301" fill="#edf4f9" font-size="14">USB device</text>
    <rect x="493" y="190" width="134" height="70" rx="35" fill="#132c37" stroke="#568b9e"/>
    <path d="M537 215h46m-46 12h46m-46 12h46" fill="none" stroke="#83ddf2" stroke-width="1.5"/>
    <path d="m578 210 6 5-6 5m-36 2-6 5 6 5m36 2 6 5-6 5" fill="none" stroke="#83ddf2" stroke-width="1.5"/>
    <text x="560" y="163" text-anchor="middle" fill="#edf4f9" font-size="18">USB/IP</text>
    <text x="560" y="292" text-anchor="middle" fill="#9bafbe" font-size="14">Managed secure network</text>
    <text x="560" y="314" text-anchor="middle" fill="#9bafbe" font-size="12">Configured by your administrator</text>
    <rect x="766" y="90" width="310" height="260" rx="12" fill="#101d29" stroke="#365369"/>
    <path d="M792 125h25v16h-25zm8 16v5m-5 0h15" fill="none" stroke="#83ddf2" stroke-width="1.8"/>
    <text x="830" y="139" fill="#edf4f9" font-size="21" font-weight="600">Linux client</text>
    <text x="792" y="176" fill="#9bafbe" font-size="14">RustUSB CLI + restricted helper</text>
    <rect x="792" y="200" width="258" height="48" rx="6" fill="#182c3a"/>
    <text x="921" y="230" fill="#bcebf6" font-family="Consolas,Liberation Mono,monospace" font-size="16" text-anchor="middle">vhci_hcd</text>
    <path d="M921 248v22" stroke="#45647a" stroke-width="2"/>
    <rect x="826" y="272" width="190" height="47" rx="6" fill="#0c141c" stroke="#365369"/>
    <text x="921" y="301" fill="#edf4f9" font-size="14" text-anchor="middle">Native device driver</text>
    <path d="M44 386h1032" stroke="#293a48"/>
    <circle cx="55" cy="416" r="4" fill="#eec18d"/><text x="70" y="421" fill="#9bafbe" font-size="13">Development preview</text><text x="1080" y="421" fill="#9bafbe" font-size="13" text-anchor="end">Built-in TLS and real-hardware acceptance remain pending</text>
  </g>
</svg>
